<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09261a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>مملكة تمساحي</title>
  <style>
    :root{--gold:#ffd875;--green:#65df90;--panel:#0c2117cc;--text:#fffaf0}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#06110c;font-family:Tahoma,Arial,sans-serif;color:var(--text)}
    body{display:flex;justify-content:center;align-items:flex-start}
    button{font:inherit;cursor:pointer}
    .app{position:relative;width:1080px;height:1920px;overflow:hidden;padding:32px 44px 26px;transform-origin:top center;background:radial-gradient(circle at 50% 23%,#3a8258 0,#183e2a 31%,#09170f 68%,#07110c)}
    .app:before{content:"";position:absolute;inset:0;opacity:.12;pointer-events:none;background-image:linear-gradient(30deg,#baffc7 1px,transparent 1px),linear-gradient(-30deg,#baffc7 1px,transparent 1px);background-size:72px 72px}
    .topbar{position:relative;z-index:10;height:142px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border:3px solid #ffffff18;border-radius:40px;background:linear-gradient(135deg,#10291dcc,#07140fe6);box-shadow:0 18px 44px #0008,inset 0 1px #ffffff12}
    .brand{display:flex;align-items:center;gap:18px}.logo{width:102px;height:102px;display:grid;place-items:center;border:4px solid var(--gold);border-radius:31px;background:linear-gradient(135deg,#66d78e,#1e5d3c);font-size:62px;box-shadow:0 12px 22px #0007}.name{font-size:38px;font-weight:900;color:var(--gold)}.sub{margin-top:5px;font-size:19px;color:#bcdbca;letter-spacing:3px}
    .stats{display:flex;direction:ltr;gap:12px}.stat{min-width:164px;height:92px;padding:10px 16px;border:2px solid #f7cf6844;border-radius:24px;background:#ffffff09;text-align:center}.stat span{display:block;font-size:18px;color:#b6cbbb}.stat b{display:block;margin-top:3px;font-size:34px;color:#fff}
    .arena{position:relative;z-index:2;height:1325px;margin-top:28px;overflow:hidden;border:4px solid #dfbd62;border-radius:48px;background:linear-gradient(180deg,#326848 0%,#183f2b 42%,#0d2a1c 100%);box-shadow:0 28px 70px #0009,inset 0 0 90px #e2cc7211}
    .arena:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.26;background:radial-gradient(circle at 15% 20%,#9bdb9d 0 3px,transparent 4px),radial-gradient(circle at 75% 66%,#6ec789 0 4px,transparent 5px);background-size:140px 160px}
    .hud{position:absolute;z-index:8;top:18px;left:24px;right:24px;display:flex;justify-content:space-between;direction:ltr}.pill{height:58px;padding:10px 18px;border:2px solid #ffffff20;border-radius:20px;background:#06160ed9;font-size:26px;font-weight:900;direction:ltr}.pill.gold{color:var(--gold)}
    .croc{position:absolute;z-index:5;width:148px;height:148px;display:grid;place-items:center;border:5px solid #aef0b9;border-radius:46px;background:radial-gradient(circle at 35% 25%,#93ecab,#3e9661 68%,#1d5639);font-size:104px;box-shadow:0 16px 30px #0009,0 0 28px #66d68a55;will-change:transform}
    .object{position:absolute;z-index:4;display:grid;place-items:center;width:116px;height:116px;border:4px solid #fff0a3;border-radius:50%;font-size:72px;background:radial-gradient(circle,#fff1a7,#dfaa45 68%,#755019);box-shadow:0 13px 24px #0009,0 0 28px #ffe07788}
    .object.enemy{border-color:#ffae9d;background:radial-gradient(circle,#ff9d83,#bd4c3f 68%,#62201a);box-shadow:0 13px 24px #0009,0 0 30px #ff6d5577}.object.shield{border-color:#91efff;background:radial-gradient(circle,#cefaff,#55bdd1 68%,#286778)}
    .particle{position:absolute;z-index:7;width:12px;height:12px;border-radius:50%;background:#fff1a0;pointer-events:none}
    .overlay{position:absolute;z-index:20;inset:0;display:none;place-items:center;direction:rtl;background:#06110ce6;backdrop-filter:blur(8px)}.overlay.show{display:grid}.card{width:760px;padding:48px 42px;border:4px solid #f4ca62;border-radius:44px;text-align:center;background:linear-gradient(145deg,#1d5033,#09180f);box-shadow:0 34px 90px #000}.card h2{margin:0 0 14px;font-size:56px;color:var(--gold)}.card p{font-size:30px;color:#d7e8dc}.card button{margin-top:20px;width:360px;height:112px;border:3px solid #fff0a1;border-radius:34px;color:#281a05;background:linear-gradient(#ffe99b,#c78a31);box-shadow:0 10px 0 #795213;font-size:36px;font-weight:900}
    .controls{position:absolute;z-index:12;bottom:28px;left:50%;width:516px;height:248px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,156px);grid-template-rows:repeat(2,112px);gap:16px;direction:ltr}.controls button{border:3px solid #ffffff25;border-radius:34px;color:#e2ffe9;background:linear-gradient(145deg,#326c4d,#10241a);box-shadow:0 8px 0 #08120d,0 16px 30px #0007;font-size:56px}.controls button:active{transform:translateY(5px);box-shadow:0 3px 0 #08120d}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}
    .message{position:absolute;z-index:11;right:80px;bottom:18px;font-size:24px;font-weight:800;color:#dceadf;text-shadow:0 3px 8px #000}
  </style>
</head>
<body>
<main class="app" id="app">
  <header class="topbar"><div class="brand"><div class="logo">🐊</div><div><div class="name">مملكة تمساحي</div><div class="sub">المهمة الذهبية</div></div></div><div class="stats"><div class="stat"><span>النتيجة</span><b id="score">0</b></div><div class="stat"><span>أفضل نتيجة</span><b id="best">0</b></div></div></header>
  <section class="arena" id="arena"><div class="hud"><div class="pill gold">★ <span id="timer">60</span></div><div class="pill">❤ <span id="lives">3</span></div></div><div class="croc" id="croc">🐊</div></section>
  <nav class="controls" aria-label="التحكم"><button class="up" data-dir="up" aria-label="أعلى">▲</button><button class="left" data-dir="left" aria-label="يسار">◀</button><button class="down" data-dir="down" aria-label="أسفل">▼</button><button class="right" data-dir="right" aria-label="يمين">▶</button></nav>
  <div class="message" id="message">أمسك العملات وتجنب الأعداء</div>
  <div class="overlay" id="overlay"><div class="card"><h2 id="cardTitle">مملكة تمساحي</h2><p id="cardText">اجمع أكبر عدد من العملات خلال 60 ثانية</p><button id="start">ابدأ المغامرة</button></div></div>
</main>
<script>
"use strict";
const app=document.getElementById('app'),arena=document.getElementById('arena'),croc=document.getElementById('croc'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),timerEl=document.getElementById('timer'),livesEl=document.getElementById('lives'),message=document.getElementById('message'),overlay=document.getElementById('overlay'),cardTitle=document.getElementById('cardTitle'),cardText=document.getElementById('cardText'),startButton=document.getElementById('start');
const W=992,H=1325,CW=148,CH=148,STEP=330;
let x=422,y=610,score=0,lives=3,time=60,running=false,last=0,spawnAcc=0,objects=[],keys={},invincible=0,best=0;
try{best=Number(localStorage.getItem('croco-best')||0)||0}catch{};bestEl.textContent=best;
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);app.style.transform=`scale(${s})`;app.style.marginLeft=`${Math.max(0,(innerWidth-1080*s)/2)}px`}function place(){croc.style.transform=`translate(${x}px,${y}px)`}
function spawn(){const r=Math.random(),kind=r<.28?'enemy':r<.43?'shield':'coin';const el=document.createElement('div');el.className='object '+(kind==='enemy'?'enemy':kind==='shield'?'shield':'');el.textContent=kind==='enemy'?'🐊':kind==='shield'?'🛡️':['🪙','💎','⭐','🍀'][Math.floor(Math.random()*4)];const ox=70+Math.random()*806,oy=100+Math.random()*1120;el.style.transform=`translate(${ox}px,${oy}px)`;el.dataset.type=kind;arena.appendChild(el);objects.push({el,x:ox,y:oy})}
function burst(px,py){for(let i=0;i<10;i++){const p=document.createElement('i');p.className='particle';p.style.left=(px+58)+'px';p.style.top=(py+58)+'px';arena.appendChild(p);const a=i/10*Math.PI*2,d=100+Math.random()*140;p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:650,easing:'ease-out'}).finished.then(()=>p.remove())}}
function overlaps(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function end(win=false){running=false;clearInterval(timerInt);for(const o of objects)o.el.remove();objects=[];if(score>best){best=score;try{localStorage.setItem('croco-best',String(best))}catch{};bestEl.textContent=best}cardTitle.textContent=win?'مهمة مكتملة!':'انتهت المغامرة';cardText.textContent=`النتيجة: ${score} — أفضل نتيجة: ${best}`;startButton.textContent='العب مرة أخرى';overlay.classList.add('show')}
let timerInt=null;
function start(){for(const o of objects)o.el.remove();objects=[];score=0;lives=3;time=60;x=422;y=610;invincible=0;scoreEl.textContent='0';livesEl.textContent='3';timerEl.textContent='60';message.textContent='أمسك العملات وتجنب الأعداء';place();overlay.classList.remove('show');running=true;last=performance.now();for(let i=0;i<7;i++)spawn();clearInterval(timerInt);timerInt=setInterval(()=>{if(!running)return;time--;timerEl.textContent=time;if(time<=0)end(true)},1000);requestAnimationFrame(loop)}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.035);last=now;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(dx&&dy){dx*=.707;dy*=.707}x=Math.max(0,Math.min(W-CW,x+dx*STEP*dt));y=Math.max(80,Math.min(H-CH,y+dy*STEP*dt));place();invincible=Math.max(0,invincible-dt);spawnAcc+=dt;if(spawnAcc>1.05){spawnAcc=0;if(objects.length<11)spawn()}const cr={x,y,w:CW,h:CH};for(let i=objects.length-1;i>=0;i--){const o=objects[i],r={x:o.x,y:o.y,w:116,h:116};if(overlaps(cr,r)){const type=o.el.dataset.type;if(type==='enemy'){if(invincible<=0){lives--;livesEl.textContent=lives;invincible=1.5;burst(o.x,o.y);o.el.remove();objects.splice(i,1);message.textContent='اصطدمت! احذر الأعداء';if(lives<=0){end(false);return}}}else if(type==='shield'){invincible=4;score+=5;scoreEl.textContent=score;burst(o.x,o.y);message.textContent='درع حماية نشط';o.el.remove();objects.splice(i,1)}else{score+=10;scoreEl.textContent=score;burst(o.x,o.y);message.textContent='جميل! عملة ذهبية';o.el.remove();objects.splice(i,1)}}}croc.style.filter=invincible>0?'brightness(1.25) drop-shadow(0 0 18px #77eaff)':'none';requestAnimationFrame(loop)}
function moveDir(dir,active){keys[dir==='left'?'ArrowLeft':dir==='right'?'ArrowRight':dir==='up'?'ArrowUp':'ArrowDown']=active}
document.querySelectorAll('[data-dir]').forEach(b=>{const dir=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();moveDir(dir,true)});b.addEventListener('pointerup',()=>moveDir(dir,false));b.addEventListener('pointerleave',()=>moveDir(dir,false));b.addEventListener('pointercancel',()=>moveDir(dir,false))});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(k))e.preventDefault();keys[k==='arrowup'?'ArrowUp':k==='arrowdown'?'ArrowDown':k==='arrowleft'?'ArrowLeft':k==='arrowright'?'ArrowRight':k]=true});window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k==='arrowup'?'ArrowUp':k==='arrowdown'?'ArrowDown':k==='arrowleft'?'ArrowLeft':k==='arrowright'?'ArrowRight':k]=false});
startButton.addEventListener('click',start);window.addEventListener('resize',fit);fit();place();overlay.classList.add('show');if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
