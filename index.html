<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173c28">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>مملكة تمساحي</title>
  <style>
    :root{--gold:#f7cf68;--green:#59cd7a;--text:#fffaf0}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{display:flex;justify-content:center;align-items:flex-start;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,#173c28,#07140e 58%,#160d10)}
    button{font:inherit;cursor:pointer}
    .app{position:relative;width:1080px;height:1920px;padding:40px 50px 60px;overflow:hidden;background:radial-gradient(circle at 50% 26%,#316d48 0,#183b29 32%,transparent 58%),linear-gradient(145deg,#173b28,#07140e);transform-origin:top center}
    .topbar{display:flex;align-items:center;justify-content:space-between;height:150px;padding:22px 28px;border:3px solid #ffffff1c;border-radius:44px;background:#08150fcc;box-shadow:0 20px 60px #0008}
    .brand{display:flex;align-items:center;gap:22px}.logo{display:grid;width:104px;height:104px;place-items:center;border:4px solid var(--gold);border-radius:32px;background:linear-gradient(135deg,#67d58a,#22613a);font-size:64px}.name{color:var(--gold);font-size:38px;font-weight:900}.sub{margin-top:8px;color:#b7cfbe;font-size:20px;letter-spacing:4px}
    .score{direction:ltr;padding:18px 24px;border:3px solid #f3ca704a;border-radius:28px;background:#ffffff0d;color:#e1ebdf;font-size:30px}.score b{color:white;font-size:44px}
    .arena{position:relative;height:1270px;margin-top:36px;overflow:hidden;border:4px solid #dabd64;border-radius:52px;background:radial-gradient(circle at 50% 35%,#56895b 0,#224730 28%,#10251a 75%),linear-gradient(45deg,#1a3b28,#0b1b12);box-shadow:0 30px 90px #0009,inset 0 0 80px #f3ca7017}
    .arena:before{content:"";position:absolute;inset:-30%;opacity:.11;background-image:linear-gradient(30deg,#fff 1px,transparent 1px),linear-gradient(-30deg,#fff 1px,transparent 1px);background-size:100px 100px}
    .stage-label{position:absolute;top:30px;right:38px;z-index:3;color:#dfd0a2;font-size:22px;letter-spacing:3px}
    .croc{position:absolute;z-index:4;display:grid;place-items:center;width:170px;height:170px;border:5px solid #9be0a8;border-radius:50px;font-size:118px;background:radial-gradient(circle at 38% 28%,#74d68e,#2f7747 70%,#19452d);box-shadow:0 22px 30px #0009,0 0 32px #67d68b55;transition:left .08s linear,top .08s linear}
    .item{position:absolute;z-index:3;display:grid;place-items:center;width:120px;height:120px;border:4px solid #fff0aa;border-radius:50%;font-size:76px;background:radial-gradient(circle,#ffe998,#d29b36 67%,#7b5419);box-shadow:0 16px 28px #0009,0 0 38px #ffd66b88;animation:pulse 1s ease-in-out infinite alternate}
    .spark{position:absolute;z-index:2;width:8px;height:8px;border-radius:50%;background:#fff3a5;box-shadow:0 0 18px #ffe66d;animation:float 2.8s linear infinite}
    .controls{display:grid;grid-template-columns:repeat(3,170px);grid-template-rows:repeat(3,170px);justify-content:center;gap:16px;margin-top:28px}
    .controls button{border:3px solid #ffffff24;border-radius:40px;color:#dfffe9;background:linear-gradient(145deg,#2a6443,#12291d);box-shadow:0 10px 0 #08120d,0 18px 38px #0007;font-size:64px}.controls button:active{transform:translateY(7px);box-shadow:0 3px 0 #08120d}
    .controls button.up{grid-column:2}.controls button.left{grid-row:2;grid-column:1}.controls button.down{grid-row:2;grid-column:2}.controls button.right{grid-row:2;grid-column:3}.controls button.start{grid-row:3;grid-column:2;font-size:28px;color:#241905;border:3px solid #fff0aa;background:linear-gradient(#ffe99b,#ce9435);box-shadow:0 10px 0 #795213}
    .message{position:absolute;right:50px;bottom:28px;left:50px;text-align:center;color:var(--gold);font-size:30px;font-weight:900;text-shadow:0 4px 12px #000}
    @keyframes pulse{to{transform:scale(1.08);filter:brightness(1.15)}}@keyframes float{to{transform:translateY(-120px) rotate(360deg);opacity:0}}
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar"><div class="brand"><div class="logo">🐊</div><div><div class="name">مملكة تمساحي</div><div class="sub">لعبة مغامرة نقاط</div></div></div><div class="score">النقاط: <b id="score">0</b></div></header>
    <section class="arena" id="arena"><div class="stage-label">المستنقع الذهبي</div><div class="croc" id="croc">🐊</div></section>
    <nav class="controls" aria-label="أزرار الحركة"><button class="up" data-dir="up" type="button">▲</button><button class="left" data-dir="left" type="button">◀</button><button class="down" data-dir="down" type="button">▼</button><button class="right" data-dir="right" type="button">▶</button><button class="start" id="start" type="button">ابدأ التحدي</button></nav>
    <div class="message" id="message">اجمع العملات الذهبية قبل انتهاء الوقت</div>
  </main>
<script>
"use strict";
const app=document.getElementById("app"),arena=document.getElementById("arena"),croc=document.getElementById("croc"),scoreNode=document.getElementById("score"),message=document.getElementById("message");
let crocX=455,crocY=550,score=0,seconds=45,running=false,timer=null,item=null,sparks=[];
function fit(){const scale=Math.min(innerWidth/1080,innerHeight/1920);app.style.transform=`scale(${scale})`;app.style.marginLeft=`${Math.max(0,(innerWidth-1080*scale)/2)}px`;app.style.position='relative'}
function placeCroc(){croc.style.left=crocX+"px";croc.style.top=crocY+"px"}
function createItem(){if(item)item.remove();item=document.createElement("div");item.className="item";item.textContent=["🪙","💎","⭐","🍀"][Math.floor(Math.random()*4)];item.style.left=Math.floor(40+Math.random()*870)+"px";item.style.top=Math.floor(100+Math.random()*1000)+"px";arena.appendChild(item)}
function createSparks(){sparks.forEach(s=>s.remove());sparks=[];for(let i=0;i<18;i++){const s=document.createElement("i");s.className="spark";s.style.left=Math.floor(Math.random()*1060)+"px";s.style.bottom=Math.floor(Math.random()*280)+"px";s.style.animationDelay=(Math.random()*2)+"s";arena.appendChild(s);sparks.push(s)}}
function move(dir){if(!running)return;const step=55;if(dir==="up")crocY-=step;if(dir==="down")crocY+=step;if(dir==="left")crocX-=step;if(dir==="right")crocX+=step;crocX=Math.max(20,Math.min(890,crocX));crocY=Math.max(100,Math.min(1080,crocY));placeCroc();checkItem()}
function checkItem(){const ix=parseFloat(item.style.left),iy=parseFloat(item.style.top);if(Math.abs(crocX-ix)<120&&Math.abs(crocY-iy)<120){score+=10;scoreNode.textContent=score;message.textContent="رائع! جمعت "+score+" نقطة";createItem()}}
function start(){clearInterval(timer);score=0;seconds=45;running=true;scoreNode.textContent="0";crocX=455;crocY=550;placeCroc();createItem();createSparks();message.textContent="الوقت المتبقي: 45 ثانية";timer=setInterval(()=>{seconds--;message.textContent="الوقت المتبقي: "+seconds+" ثانية";if(seconds<=0){clearInterval(timer);running=false;message.textContent="انتهى التحدي — مجموعك "+score+" نقطة"}},1000)}
document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("click",()=>move(b.dataset.dir)));document.getElementById("start").addEventListener("click",start);
window.addEventListener("keydown",e=>{const keys={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"};if(keys[e.key]){e.preventDefault();move(keys[e.key])}});
window.addEventListener("resize",fit);fit();placeCroc();createItem();createSparks();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body>
</html>
